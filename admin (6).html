<!doctype html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Panel admin · JB Tech</title><meta name="robots" content="noindex,nofollow"><style>
:root{--bg:#141013;--p:#1d1719;--p2:#221b1e;--line:#44383d;--red:#9b2242;--txt:#f2ecee;--muted:#9a9096}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--txt);font:15px system-ui,Segoe UI,Arial;line-height:1.5}.wrap{max-width:760px;margin:auto;padding:40px 24px 100px}h1{font-size:24px;margin:0 0 5px}.sub{color:var(--muted);font-size:14px}label{display:block;color:var(--muted);font:11px ui-monospace;margin:0 0 6px;text-transform:uppercase}input,textarea,select{width:100%;padding:11px 13px;margin:0 0 16px;border:1px solid var(--line);border-radius:8px;background:var(--p2);color:var(--txt)}textarea{min-height:90px;resize:vertical}button{padding:10px 16px;border-radius:8px;border:1px solid var(--line);background:transparent;color:var(--txt);cursor:pointer;font-weight:600}.primary{background:var(--red);border-color:var(--red);color:white}.danger{color:#e07a7a;border-color:#7b3b46}.login{max-width:380px;margin:80px auto;padding:32px;background:var(--p);border:1px solid var(--line);border-radius:10px}.login h1,.login .sub{text-align:center}.err{color:#e07a7a;font-size:13px;display:none}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:28px}.eyebrow{color:var(--red);font:11px ui-monospace;text-transform:uppercase;letter-spacing:.14em}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:24px}.tab.active{background:rgba(155,34,66,.16);border-color:var(--red)}.card{background:var(--p);border:1px solid var(--line);border-radius:10px;padding:22px;margin-bottom:20px}.filters{display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:10px}.row{padding:14px 16px;background:var(--p2);border:1px solid var(--line);border-radius:8px;margin-bottom:9px;cursor:pointer}.row:hover{border-color:var(--red)}.rowtop{display:flex;justify-content:space-between;gap:10px}.date{color:var(--muted);font:11px ui-monospace}.badge{display:inline-block;padding:3px 8px;border-radius:20px;font:11px ui-monospace}.nuevo{background:#253b61}.en_seguimiento{background:#574b20}.contactado{background:#214d35}.cerrado{background:#444}.descartado{background:#57262c}.detail{margin-top:12px;padding:14px;border:1px solid var(--red);border-radius:8px;background:var(--p)}.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.kpi{padding:16px;background:var(--p2);border:1px solid var(--line);border-radius:8px}.kpi b{font:24px ui-monospace}.project{padding:16px;background:var(--p2);border:1px solid var(--line);border-radius:8px;margin-bottom:12px}.preview{height:130px;border:1px dashed var(--line);display:flex;align-items:center;justify-content:center;margin-bottom:10px;border-radius:8px}.preview img{max-width:100%;max-height:100%}.save{position:fixed;bottom:0;left:0;right:0;background:var(--p);border-top:1px solid var(--line);padding:14px;text-align:center}.save button{min-width:180px}.empty{text-align:center;color:var(--muted);padding:25px}.pager{text-align:center;margin-top:15px;display:flex;justify-content:center;gap:8px}@media(max-width:650px){.filters{grid-template-columns:1fr}.kpis{grid-template-columns:1fr 1fr}}
</style></head><body>
<div id="login" class="login"><div class="eyebrow">JB TECH</div><h1>Panel de administración</h1><p class="sub">Ingresa tus datos para administrar JB TECH AI.</p><label>Usuario</label><input id="user" autocomplete="username"><label>Contraseña</label><input id="pass" type="password" autocomplete="current-password"><p id="loginErr" class="err"></p><button class="primary" style="width:100%" onclick="login()">Entrar</button></div>
<div id="app" class="wrap" style="display:none"><div class="top"><div><div class="eyebrow">JB TECH · PANEL ADMIN</div><h1 id="title">Contenido del sitio</h1></div><button onclick="logout()">Salir</button></div><div class="tabs"><button id="bContenido" class="tab active" onclick="tab('contenido')">Contenido</button><button id="bDashboard" class="tab" onclick="tab('dashboard')">Dashboard</button><button id="bSolicitudes" class="tab" onclick="tab('solicitudes')">Solicitudes</button><button id="bContactos" class="tab" onclick="tab('contactos')">Contactos</button></div><div id="msg"></div>
<section id="contenido"><div class="card"><h2>Inicio</h2><label>Eyebrow</label><input id="hero_eyebrow"><label>Título</label><textarea id="hero_title"></textarea><label>Frase</label><textarea id="hero_tagline"></textarea><label>Presentación</label><textarea id="hero_sub"></textarea></div><div class="card"><h2>Sobre mí</h2><label>Título</label><input id="about_title"><label>Texto</label><textarea id="about_p1"></textarea></div><div class="card"><h2>Contacto</h2><label>Frase</label><textarea id="contact_tagline"></textarea><label>WhatsApp</label><input id="contact_whatsapp"><label>Ubicación</label><input id="contact_location"><label>Disponibilidad</label><input id="contact_availability"></div><div class="card"><div class="top"><h2>Otros proyectos</h2><button onclick="addProject()">+ Agregar</button></div><div id="projects"></div></div></section>
<section id="dashboard" style="display:none"><div class="card"><h2>Resumen</h2><div id="kpis" class="kpis"></div></div><div class="card"><h2>Solicitudes recientes</h2><div id="recent"></div></div></section>
<section id="solicitudes" style="display:none"><div class="card"><div class="filters"><input id="search" placeholder="Proyecto o necesidad…"><select id="estado"><option value="">Todos</option><option>nuevo</option><option>en_seguimiento</option><option>contactado</option><option>cerrado</option><option>descartado</option></select><input id="from" type="date"><input id="to" type="date"></div><div id="leads"></div><div id="lp" class="pager"></div></div></section>
<section id="contactos" style="display:none"><div class="card"><input id="csearch" placeholder="Nombre, correo o WhatsApp…"><div id="contacts"></div><div id="cp" class="pager"></div></div></section></div><div id="save" class="save" style="display:none"><button class="primary" onclick="saveContent()">Guardar cambios</button></div>
<script>
let cred=null,content=null,projects=[],leadPage=1,contactPage=1,leadTotal=0,contactTotal=0,open=null;const labels={nuevo:'Nuevo',en_seguimiento:'En seguimiento',contactado:'Contactado',cerrado:'Cerrado',descartado:'Descartado'};
const $=id=>document.getElementById(id), esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function status(t,e=false){$('msg').innerHTML='<div class="card" style="color:'+(e?'#e07a7a':'#7fcf9a')+'">'+esc(t)+'</div>';setTimeout(()=>$('msg').innerHTML='',3500)}
function date(v){if(!v)return 'Sin fecha';try{return new Date(v).toLocaleDateString('es-CO',{year:'numeric',month:'short',day:'numeric'})}catch{return v}}
function badge(v){return '<span class="badge '+esc(v||'')+'">'+esc(labels[v]||'Sin estado')+'</span>'}
async function json(url,opt){const r=await fetch(url,{credentials:'same-origin',...opt});let d=null;try{d=await r.json()}catch{}if(r.status===401)return{unauth:true};if(!r.ok||!d||d.ok!==true)return{err:d?.message||'No se pudo completar la solicitud.'};return{data:d.data??d}}
async function login(){const u=$('user').value.trim(),p=$('pass').value;$('loginErr').style.display='none';try{const r=await json('/api/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:u,password:p})});if(r.err){$('loginErr').textContent=r.err;$('loginErr').style.display='block';return}const c=await fetch('/api/content');if(!c.ok)throw Error();content=await c.json();cred={username:u,password:p};fill();$('login').style.display='none';$('app').style.display='block';$('save').style.display='block';tab('dashboard')}catch{$('loginErr').textContent='No se pudo completar la solicitud.';$('loginErr').style.display='block'}}
async function logout(){try{await fetch('/api/admin/logout',{method:'POST',credentials:'same-origin'})}catch{}location.reload()}
function fill(){const h=content.hero||{},a=content.about||{},c=content.contact||{};['eyebrow','title','tagline','sub'].forEach(k=>{$('hero_'+k).value=h[k]||''});$('about_title').value=a.title||'';$('about_p1').value=a.p1||'';['tagline','whatsapp','location','availability'].forEach(k=>{$('contact_'+k).value=c[k]||''});projects=(content.projects||[]).slice();renderProjects()}
function renderProjects(){ $('projects').innerHTML=projects.map((p,i)=>'<div class="project"><div class="top"><b>PROYECTO '+(i+1)+'</b><button class="danger" onclick="projects.splice('+i+',1);renderProjects()">Eliminar</button></div><div class="preview">'+(p.image?'<img src="'+esc(p.image)+'">':'Sin imagen')+'</div><label>Imagen</label><input type="file" accept="image/*" onchange="upload(event,'+i+')"><label>Nombre</label><input value="'+esc(p.name)+'" onchange="projects['+i+'].name=this.value"><label>Etiqueta</label><input value="'+esc(p.tag)+'" onchange="projects['+i+'].tag=this.value"><label>Descripción</label><textarea onchange="projects['+i+'].description=this.value">'+esc(p.description)+'</textarea><label>Link</label><input value="'+esc(p.link)+'" onchange="projects['+i+'].link=this.value"></div>').join('')||'<div class="empty">No hay proyectos.</div>'}
function addProject(){projects.push({name:'Nuevo proyecto',tag:'WEB',description:'',link:'',image:null});renderProjects()}
async function upload(e,i){const f=e.target.files?.[0];if(!f)return;const reader=new FileReader();reader.onload=async()=>{const img=new Image();img.onload=async()=>{const s=Math.min(1,1000/img.width),c=document.createElement('canvas');c.width=img.width*s;c.height=img.height*s;c.getContext('2d').drawImage(img,0,0,c.width,c.height);const b=c.toDataURL('image/jpeg',.82).split(',')[1];try{const r=await fetch('/api/upload-image',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:cred.username,password:cred.password,dataBase64:b,contentType:'image/jpeg'})});const d=await r.json();if(!r.ok)throw Error(d.error||'Error');projects[i].image=d.url;renderProjects()}catch{status('No se pudo subir la imagen.',true)}};img.src=reader.result};reader.readAsDataURL(f)}
async function saveContent(){const body={hero:{eyebrow:$('hero_eyebrow').value,title:$('hero_title').value,tagline:$('hero_tagline').value,sub:$('hero_sub').value},about:{title:$('about_title').value,p1:$('about_p1').value},contact:{tagline:$('contact_tagline').value,whatsapp:$('contact_whatsapp').value,location:$('contact_location').value,availability:$('contact_availability').value},projects};const r=await json('/api/content',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:cred.username,password:cred.password,content:body})});status(r.err||'Cambios guardados. Ya están en vivo.',!!r.err)}
function tab(n){['contenido','dashboard','solicitudes','contactos'].forEach(x=>{$(x).style.display=x===n?'block':'none';$('b'+x[0].toUpperCase()+x.slice(1)).classList.toggle('active',x===n)});$('title').textContent=n==='contenido'?'Contenido del sitio':n[0].toUpperCase()+n.slice(1);$('save').style.display=n==='contenido'?'block':'none';if(n==='dashboard')dashboard();if(n==='solicitudes')leads();if(n==='contactos')contacts()}
async function dashboard(){const r=await json('/api/admin/dashboard');if(r.err||r.unauth){$('kpis').innerHTML='<div class="empty">'+esc(r.err||'Sesión no válida.')+'</div>';return}const d=r.data||{},c=d.counts||{};$('kpis').innerHTML=Object.keys(labels).map(k=>'<div class="kpi"><b>'+((c[k])||0)+'</b><div>'+labels[k]+'</div></div>').join('')+'<div class="kpi"><b>'+(d.totalContactos||0)+'</b><div>Contactos</div></div>';$('recent').innerHTML=(d.recent||[]).map(x=>'<div class="row" onclick="tab(\'solicitudes\')"><div class="rowtop"><b>'+esc(x.proyecto||'Sin proyecto')+'</b><span class="date">'+date(x.fecha)+'</span></div><div>'+esc(x.necesidad||'Sin necesidad')+' · '+badge(x.estado)+'</div></div>').join('')||'<div class="empty">No hay solicitudes todavía.</div>'}
async function leads(){const q=new URLSearchParams({page:leadPage});if($('search').value)q.set('search',$('search').value);if($('estado').value)q.set('estado',$('estado').value);if($('from').value)q.set('dateFrom',$('from').value);if($('to').value)q.set('dateTo',$('to').value);const r=await json('/api/admin/leads?'+q);if(r.err||r.unauth){$('leads').innerHTML='<div class="empty">'+esc(r.err||'Sesión no válida.')+'</div>';return}const d=r.data||{};leadTotal=+(d.total||0);$('leads').innerHTML=(d.items||[]).map(x=>'<div class="row" onclick="detail(\''+esc(x.id)+'\',\''+esc(x.conversation_id)+'\',event)"><div class="rowtop"><b>'+esc(x.proyecto||'Sin proyecto')+'</b><span class="date">'+date(x.fecha)+'</span></div><div>'+esc(x.necesidad||'Sin necesidad')+' · '+badge(x.estado)+'</div><div id="d'+esc(x.id)+'"></div></div>').join('')||'<div class="empty">No hay solicitudes.</div>';pager('lp',leadPage,leadTotal,p=>{leadPage=p;leads()})}
async function detail(id,conv,e){if(e?.target?.tagName==='SELECT')return;const s=$('d'+id);if(open===id){s.innerHTML='';open=null;return}open=id;s.innerHTML='<div class="detail">Cargando…</div>';const r=await json('/api/admin/leads?id='+encodeURIComponent(conv));if(r.err||r.unauth){s.innerHTML='<div class="detail">'+esc(r.err||'Sesión no válida.')+'</div>';return}const d=r.data||{},l=d.lead||{},c=d.conversacion||{},ct=d.contacto;let h='<div class="detail" onclick="event.stopPropagation()"><p><b>Problema</b><br>'+esc(l.problema||'No disponible')+'</p><p><b>Objetivo</b><br>'+esc(l.objetivo||'No disponible')+'</p><p><b>Solución sugerida</b><br>'+esc(l.solucion_sugerida||'No disponible')+'</p><p><b>Valoración</b><br>'+((typeof l.lead_score==='number')?l.lead_score+' / 100':'No disponible')+'</p><p><b>Consentimiento</b><br>'+(c.consentimiento?'Autorizado':'No autorizado')+'</p>';if(ct)h+='<p><b>Contacto</b><br>'+esc(ct.nombre||'')+(ct.whatsapp?'<br>WhatsApp: '+esc(ct.whatsapp):'')+(ct.correo?'<br>Correo: '+esc(ct.correo):'')+'</p>';h+='<label>Estado</label><select onchange="changeStatus(\''+esc(id)+'\',this)">'+Object.keys(labels).map(k=>'<option value="'+k+'" '+(k===l.estado?'selected':'')+'>'+labels[k]+'</option>').join('')+'</select></div>';s.innerHTML=h}
async function changeStatus(id,el){el.disabled=true;let r=await json('/api/admin/leads',{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({id,estado:el.value})});if(r.err){r=await json('/api/admin/leads',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id,estado:el.value})})}status(r.err||'Estado actualizado.',!!r.err);if(!r.err)leads();else el.disabled=false}
async function contacts(){const q=new URLSearchParams({page:contactPage});if($('csearch').value)q.set('search',$('csearch').value);const r=await json('/api/admin/contacts?'+q);if(r.err||r.unauth){$('contacts').innerHTML='<div class="empty">'+esc(r.err||'Sesión no válida.')+'</div>';return}const d=r.data||{};contactTotal=+(d.total||0);$('contacts').innerHTML=(d.items||[]).map(x=>'<div class="row"><div class="rowtop"><b>'+esc(x.nombre||'Sin nombre')+'</b><span class="date">'+date(x.fecha)+'</span></div><div>'+(x.whatsapp?'WhatsApp: '+esc(x.whatsapp)+' · ':'')+(x.correo?'Correo: '+esc(x.correo)+' · ':'')+'Proyecto: '+esc(x.proyecto||'No disponible')+'</div></div>').join('')||'<div class="empty">No hay contactos.</div>';pager('cp',contactPage,contactTotal,p=>{contactPage=p;contacts()})}
function pager(id,page,total,set){const pages=Math.max(1,Math.ceil(total/20));$(id).innerHTML=pages>1?'<button '+(page<=1?'disabled':'')+' onclick="('+set.name+')('+(page-1)+')">← Anterior</button><span style="padding:10px;color:var(--muted)">'+page+' / '+pages+'</span><button '+(page>=pages?'disabled':'')+' onclick="('+set.name+')('+(page+1)+')">Siguiente →</button>':''}
$('search').oninput=()=>{leadPage=1;clearTimeout(window.t);window.t=setTimeout(leads,350)};$('estado').onchange=()=>{leadPage=1;leads()};$('from').onchange=()=>{leadPage=1;leads()};$('to').onchange=()=>{leadPage=1;leads()};$('csearch').oninput=()=>{contactPage=1;clearTimeout(window.ct);window.ct=setTimeout(contacts,350)};
(async()=>{try{const r=await fetch('/api/admin/dashboard',{credentials:'same-origin'});if(!r.ok)return;const c=await fetch('/api/content');if(!c.ok)return;content=await c.json();fill();$('login').style.display='none';$('app').style.display='block';tab('dashboard')}catch{}})();
</script></body></html>
